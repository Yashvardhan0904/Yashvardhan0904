<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-labelledby="title">
  <title id="title">Yashvardhan GitHub profile</title>
  <defs>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#cc0000"/>
      <stop offset=".5" stop-color="#5d1111"/>
      <stop offset="1" stop-color="#cc0000"/>
    </linearGradient>
    <filter id="nameGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes nameShine { 0%, 100% { opacity: .86; } 50% { opacity: 1; } }
      @keyframes spiderTurn { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .name { animation: nameShine 4s ease-in-out infinite; }
      .spider { transform-origin: 760px 110px; animation: spiderTurn 9s linear infinite; }
    </style>
  </defs>
  <rect width="900" height="220" rx="14" fill="#0d0d0d"/>
  <rect x="1" y="1" width="898" height="218" rx="13" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <text class="name" x="52" y="112" fill="#ffffff" font-family="Arial Black, Arial, sans-serif" font-size="50" font-weight="900" letter-spacing="2" filter="url(#nameGlow)">YASHVARDHAN</text>
  <g class="spider" fill="none" stroke="#cc0000" stroke-linecap="round">
    <circle cx="760" cy="104" r="22" fill="#cc0000" stroke="none"/>
    <ellipse cx="760" cy="145" rx="30" ry="38" fill="#cc0000" stroke="none"/>
    <path d="M739 122L695 95M735 136L685 130M735 151L692 169M781 122L825 95M785 136L835 130M785 151L828 169" stroke-width="8"/>
    <path d="M750 98L743 86M770 98L777 86" stroke="#ffffff" stroke-width="4"/>
    <path d="M760 122V172M741 145H779" stroke="#0d0d0d" stroke-width="3"/>
  </g>
</svg>
